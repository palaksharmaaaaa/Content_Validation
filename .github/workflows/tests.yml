name: tests

on:
  push:
  pull_request:

permissions:
  contents: read          # the job only reads the repository and its LFS objects

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false         # fetched below from a cache, so each run does not spend the repository's Git LFS bandwidth quota
      - name: List the Git LFS objects (the cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache the Git LFS objects (the trained checkpoints)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull the Git LFS objects
        run: git lfs pull
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: System packages (ffmpeg, OpenCV runtime)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
      - name: Install (CPU-only torch keeps the job small)
        run: |
          python -m pip install --upgrade pip
          # the same torch / torchvision versions as the lock file, from the CPU wheel index
          TORCH=$(grep -iE '^torch==' requirements.lock.txt | cut -d= -f3)
          TV=$(grep -iE '^torchvision==' requirements.lock.txt | cut -d= -f3)
          pip install "torch==${TORCH}" "torchvision==${TV}" --index-url https://download.pytorch.org/whl/cpu
          grep -viE '^(torch|torchvision)==' requirements.lock.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
      - name: Cache pretrained models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-rfdetr-3bdc465-siglip2-75de2d5   # change when a pinned revision changes
      - name: Download pretrained models (RF-DETR Small, SigLIP 2 Base)
        run: python -m services.fetch_models
      - name: Test
        env:
          GOLDEN_DUMP: "1"
        run: python -m pytest -q -s
