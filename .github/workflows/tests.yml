name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # the trained checkpoints are Git LFS objects
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: System packages (ffmpeg, OpenCV runtime)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
      - name: Install (CPU-only torch keeps the job small)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          grep -viE '^(torch|torchvision)==' requirements.lock.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
      - name: Cache pretrained models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-rfdetr-3bdc465-siglip2-75de2d5   # change when a pinned revision changes
      - name: Download pretrained models (RF-DETR Small, SigLIP 2 Base)
        run: python -m services.fetch_models
      - name: Test
        env:
          GOLDEN_DUMP: "1"
        run: python -m pytest -q -s
