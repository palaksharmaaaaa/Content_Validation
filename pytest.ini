[pytest]
testpaths =
    core/tests
    image_detector/tests
    audio_detector/tests
    video_detector/tests
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    default::DeprecationWarning
    ignore::DeprecationWarning:transformers.*:
    ignore::DeprecationWarning:torch.*:
    ignore::DeprecationWarning:streamlit.*:
    ignore::DeprecationWarning:evidently.*:
    ignore::UserWarning
