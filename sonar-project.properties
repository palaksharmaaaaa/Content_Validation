# SonarQube Cloud analysis. The token is never stored here: CI reads it from the SONAR_TOKEN repository secret.
sonar.organization=hgarg02
sonar.projectKey=hgarg02_content-validation
sonar.projectName=Content Validation

sonar.sources=app.py,core,image_detector,audio_detector,video_detector,services,ui
sonar.tests=tests,core/tests,image_detector/tests,audio_detector/tests,video_detector/tests
sonar.test.inclusions=**/tests/**,**/test_*.py

# MiVOLO's network code is third-party (Apache-2.0) and vendored unchanged apart from the notes in its header
sonar.exclusions=core/perception/mivolo_vendor/**,**/__pycache__/**
sonar.coverage.exclusions=**/tests/**,tests/**,conftest.py

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
